# GitLab CI for the Leaf client (React, Create React App via react-app-rewired).
# GitHub mirrors every merge to main here; Render deploys from this repo.

stages:
  - check
  - build

# Cache npm's download cache; npm ci rebuilds node_modules each time anyway.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

variables:
  NODE_VERSION: "22"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

.node:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  extends: .node
  stage: check
  script:
    - npx tsc --noEmit -p .

test:
  extends: .node
  stage: check
  variables:
    CI: "true"  # one run, no watch mode
  script:
    - npx react-app-rewired test --watchAll=false --coverage
  coverage: '/All files\s+\|\s+(\d+\.?\d*)/'
  artifacts:
    when: always
    reports:
      junit: coverage/junit.xml
    paths:
      - coverage/
    expire_in: 1 week

# Builds the same way Render does. CI=false so lint warnings stay warnings,
# as they are on Render; with CI=true Create React App fails the build on them.
build:
  extends: .node
  stage: build
  variables:
    CI: "false"
  script:
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

# Report only. react-scripts is a runtime dependency in package.json, so even
# --omit=dev includes Create React App's build tooling, which has high findings
# with no non-breaking fix. Nothing here blocks a deploy.
security-audit:
  extends: .node
  stage: check
  script:
    - npm audit --omit=dev || echo "Findings above are report only"
  allow_failure: true
